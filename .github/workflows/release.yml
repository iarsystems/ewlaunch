name: Build & Release

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # "Run workflow" button: test build, no release
    inputs:
      ref:
        description: "Commit SHA, tag or branch (default: selected branch)"
        required: false
        default: ""

permissions:
  contents: write   # required for releases

jobs:
  build-and-release:
    name: Build Windows package and publish release
    runs-on: windows-2022

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # ------------------------------------------------------------
      # Python setup
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.3

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build with PyInstaller
        env:
          VERSION_TAG: ${{ github.ref_name }}
          IS_RELEASE: ${{ github.event_name == 'push' }}
        run: |
          if ($env:IS_RELEASE -ne 'true') {
            $env:VERSION_TAG = "test-$(git rev-parse --short HEAD)"
          }
          "ZIP=ewlaunch-$env:VERSION_TAG.zip" >> $env:GITHUB_ENV

          mkdir ewlaunch

          pyinstaller --windowed ewlaunch_win.py --icon=ewlaunch.ico
          pyinstaller ewlaunch.py

          Move-Item dist/ewlaunch_win/ewlaunch_win.exe ewlaunch/
          Move-Item dist/ewlaunch/ewlaunch.exe ewlaunch/
          Move-Item dist/ewlaunch_win/_internal ewlaunch/

          Copy-Item installations.ini ewlaunch/
          Copy-Item ewlaunch.ini ewlaunch/
          Copy-Item add_context_menu.reg ewlaunch/
          Copy-Item remove_context_menu.reg ewlaunch/
          Copy-Item README.md ewlaunch/
          Copy-Item init_env.bat ewlaunch/
          Copy-Item init_shell.bat ewlaunch/

          Compress-Archive ewlaunch "ewlaunch-$env:VERSION_TAG.zip"

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP }}
          archive: false
          retention-days: 30

      # ------------------------------------------------------------
      # Release
      # ------------------------------------------------------------
      - name: Create GitHub release (if missing)
        if: github.event_name == 'push'
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" \
          || gh release create "${{ github.ref_name }}" \
               --title "Release ${{ github.ref_name }}" \
               --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # - name: Verify build output
      #   shell: bash
      #   run: |
      #     pwd
      #     ls -lah

      - name: Upload release asset
        if: github.event_name == 'push'
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" "./$ZIP" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
